[project]
name = "posture-brief"
version = "0.1.0"
description = "Turn cloud misconfiguration findings into a plain English remediation brief."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
posture-brief = "posture_brief.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posture_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
